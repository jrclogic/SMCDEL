image: haskell:9.10.3-bookworm

variables:
  STACK_ROOT: "${CI_PROJECT_DIR}/.stack"

cache: &global_cache
  paths:
    - .stack
    - .stack-work

before_script:
  - stack config set system-ghc --global true

build:
  stage: build
  script:
    - rm -rf .stack-work/install/*/*/*/bin
    - stack build --no-terminal --coverage --test --bench --no-run-tests --no-run-benchmarks
  after_script:
    - rm -rf ./bin
    - mv .stack-work/install/*/*/*/bin ./bin
  artifacts:
    paths:
      - "bin/"

test:
  stage: test
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends graphviz dot2tex python3-pkg-resources libtinfo5 texlive-latex-base texlive-latex-extra poppler-utils preview-latex-style texlive-pstricks poppler-utils
    - rm -rf .stack-work/install/*/*/*/hpc
    - stack --no-terminal test --coverage smcdel:test:examples smcdel:test:k smcdel:test:translations
  coverage: '/(\d+)% top-level declarations used/'
  after_script:
    - rm -rf ./hpc
    - mv .stack-work/install/*/*/*/hpc ./hpc
  artifacts:
    when: always
    paths:
      - "hpc/"
  cache:
    <<: *global_cache
    policy: pull

test-web:
  stage: test
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends graphviz dot2tex python3-pkg-resources libtinfo5 texlive-latex-base texlive-latex-extra poppler-utils preview-latex-style texlive-pstricks ca-certificates-java pkg-config
    - apt-get install -y --no-install-recommends openjdk-17-jre-headless firefox-esr wget
    - stack --no-terminal test --flag smcdel:web smcdel:exe:smcdel-web smcdel:test:web --test-arguments "--headless"
  cache:
    <<: *global_cache
    policy: pull

test-CUDD:
  stage: test
  script:
    - rm -rf .stack-work/install/*/*/*/hpc
    - stack --no-terminal test --allow-newer --flag smcdel:with-cudd --coverage smcdel:test:CUDD
  only:
    changes:
      - test/CUDD.hs
      - src/SMCDEL/Internal/MyHaskCUDD.hs
      - src/SMCDEL/Symbolic/S5_CUDD.hs
      - src/SMCDEL/Symbolic/K_CUDD.hs
      - src/SMCDEL/Symbolic/Ki_CUDD.hs
  coverage: '/(\d+)% top-level declarations used/'
  after_script:
    - rm -rf ./hpc
    - mv .stack-work/install/*/*/*/hpc ./hpc
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "hpc/"
  cache:
    <<: *global_cache
    policy: pull

hlint:
  image: debian:stable
  before_script:
    - apt-get update -y
    - apt-get install -y curl
  stage: build
  script:
    - curl -sL https://raw.github.com/ndmitchell/hlint/master/misc/travis.sh | sh -s .
  cache:
    policy: pull

doc:
  stage: test
  script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends graphviz dot2tex python3-pkg-resources libtinfo5 texlive-latex-base texlive-latex-extra poppler-utils preview-latex-style texlive-pstricks poppler-utils ripgrep
    - stack build smcdel:lib smcdel:test:doctest --haddock
    - rm -rf ./doc
    - mv -v `ls -1 -d -t .stack-work/install/*/*/*/doc | head -n 1` ./doc
  artifacts:
    when: always
    paths:
      - "doc/"
  cache:
    <<: *global_cache
    policy: pull
